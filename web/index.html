<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>content_feed — Creators get paid</title>
<meta name="description" content="Short videos from African creators. Tip and send gifts by mobile money.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <!-- FEED -->
  <section class="view active" id="view-feed" aria-label="Feed">
    <header class="feed-top">
      <div class="brand">content<span>_</span>feed</div>
      <button class="icon-btn" id="soundBtn" aria-label="Turn sound on" aria-pressed="false">
        <svg class="off" viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.5 2.5V12ZM19 12c0 .9-.2 1.8-.5 2.6l1.5 1.5A8.9 8.9 0 0 0 21 12a9 9 0 0 0-7-8.8v2.1A7 7 0 0 1 19 12ZM4.3 3 3 4.3 7.7 9H3v6h4l5 5v-6.7l4.3 4.3a7 7 0 0 1-2.3 1.2v2.1a9 9 0 0 0 3.7-1.8l2 2L21 19.7l-9-9L4.3 3ZM12 4 9.9 6.1 12 8.2V4Z"/></svg>
        <svg class="on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3Zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4ZM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6Z"/></svg>
      </button>
    </header>
    <main class="feed" id="feed">
      <!-- Sample post for design reference -->
      <div class="post">
        <video src="sample.mp4" autoplay muted loop></video>
        <div class="shade"></div>
        <div class="creator">@creator_name</div>
        <div class="actions">
          <button class="icon-btn action-btn" aria-label="Like"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button>
          <button class="icon-btn action-btn" aria-label="Comment"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v14l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></button>
          <button class="icon-btn action-btn" aria-label="Share"><svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7a2.5 2.5 0 0 0 0-1.4l7.05-4.11a2.5 2.5 0 1 0-.9-1.45L8 9.5a2.5 2.5 0 1 0 0 5l7.15 4.18c.52.48 1.2.78 1.96.78a2.5 2.5 0 1 0 0-5z"/></svg></button>
          <button class="icon-btn action-btn" aria-label="Gift"><svg viewBox="0 0 24 24"><path d="M12 2C9.79 2 8 3.79 8 6c0 2.21 1.79 4 4 4s4-1.79 4-4c0-2.21-1.79-4-4-4zm0 6c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-6 8v2h12v-2H6z"/></svg></button>
        </div>
        <div class="paused-icon"><svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></div>
      </div>
    </main>
  </section>

  <!-- CREATE -->
  <section class="view" id="view-create" aria-label="Post a video">
    <div class="page">
      <h1>Post a video</h1>
      <p class="muted">Up to <span id="maxSec"></span> seconds. Fans can tip you and send gifts.</p>
      <label class="picker" id="picker">
        <input type="file" id="fileInput" accept="video/*" hidden>
        <video id="preview" playsinline muted loop hidden></video>
        <span class="picker-empty" id="pickerEmpty">
          <svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4Z"/></svg>
          <b>Choose or record a video</b>
          <small>Tap to open your camera or gallery</small>
        </span>
      </label>
      <label class="field-label" for="caption">Caption</label>
      <textarea id="caption" maxlength="300" rows="3" placeholder="Say something about your video… #hashtags"></textarea>
      <button class="btn primary full" id="postBtn" disabled>Post</button>
      <p class="muted small" id="createNote">Demo mode: your video stays on this phone.</p>
    </div>
  </section>

  <!-- EARNINGS -->
  <section class="view" id="view-earn" aria-label="Your earnings">
    <di
</body>
</html>
